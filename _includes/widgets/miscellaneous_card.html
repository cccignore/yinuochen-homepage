{% if site.data.profile.service %}
<div class="row mt-3">
    <div class="col">
        <section class="card border-0 shadow-sm bg-white" aria-label="Service">
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-12">
                        <div class="mx-2 my-1">
                            <h6>Service</h6>
                            <ul class="list small pl-3 mb-1">
                                {% for item in site.data.profile.service %}
                                <li>
                                    <div class="d-flex">
                                        <div>{{ item.name }}</div>
                                        <div class="ml-auto mt-auto no-break"><em>{{ item.date }}</em></div>
                                    </div>
                                </li>
                                {% endfor %}
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
{% endif %}
