short_bio: >-
  <p>
    My research interests focus on embodied AI and agentic robotic systems:
    how models, tools, memory, and execution feedback support reliable robot
    behavior. I am particularly interested in when skills and experience can
    be reused across tasks.
  </p>
  <p>
    Alongside research, I develop AI applications and multimodal workflows,
    including AI video production and LLM-powered information services.
    My recent research examines robot video world models and policy state
    at task boundaries, with two contributions accepted at IROS 2026 workshops.
  </p>

