name: Update GitHub activity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Refresh the cached GitHub contribution chart
        run: python3 scripts/update_github_contributions.py cccignore assets/images/github-contributions.svg _data/github_contributions.json

      - name: Commit profile data when it changed
        run: |
          if git diff --quiet -- assets/images/github-contributions.svg _data/github_contributions.json; then
            echo "GitHub activity data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/github-contributions.svg _data/github_contributions.json
          git commit -m "chore: update GitHub activity"
          git push
